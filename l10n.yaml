# Configuration for `flutter gen-l10n`.
#
# Strings live in lib/l10n/*.arb. The generator produces
# `AppLocalizations` (generated package `package:flutter_gen`) which the
# shared/localization module wraps in a typed, context-safe API.
arb-dir: lib/l10n
template-arb-file: app_en.arb
output-localizations-file: app_localizations.dart
output-class: AppLocalizations
nullable-getter: false
