name: onebit
description: "OneBit — Decentralized mesh messenger."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  drift: ^2.22.1
  sqlite3_flutter_libs: ^0.5.28
  path_provider: ^2.1.5
  path: ^1.9.1
  shared_preferences: ^2.5.5
  cryptography: ^2.2.1
  flutter_secure_storage: ^9.2.4
  qr: ^4.0.0
  mobile_scanner: ^7.0.3
  flutter_svg: ^2.0.10+1
  image_picker: ^1.1.2
  shimmer: ^3.0.0
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.22.1
  build_runner: ^2.4.14
  mockito: ^5.4.4
  build_verify: ^3.1.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icons/OneBitLogo.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/icons/OneBitLogo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
  fonts:
    - family: Consolas
      fonts:
        - asset: assets/fonts/Consola.ttf
        - asset: assets/fonts/Consolab.ttf
          weight: 700
        - asset: assets/fonts/Consolai.ttf
          style: italic
        - asset: assets/fonts/Consolaz.ttf
          weight: 700
          style: italic
